name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils

      - name: Fetch pinned reference files
        run: ./tools/fetch-reference.sh

      - name: Build keyboard layout
        run: ./build.sh

      - name: Check the committed preview matches the layout
        run: |
          ./tools/preview-layout.py
          if ! git diff --quiet -- docs/preview.svg; then
            echo '::error file=docs/preview.svg::stale preview; run ./tools/preview-layout.py and commit docs/preview.svg'
            git diff -- docs/preview.svg
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: russian-us-punctuation-${{ github.sha }}
          path: |
            build/Russian US Punctuation.bundle.zip
            docs/preview.svg
          if-no-files-found: error
