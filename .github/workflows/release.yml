name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # the annotated tag's own message becomes the release notes
          fetch-depth: 0

      - name: Install XML validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils

      - name: Fetch pinned reference files
        run: ./tools/fetch-reference.sh

      - name: Build keyboard layout
        run: ./build.sh

      - name: Stage release assets
        run: |
          ./tools/preview-layout.py
          mkdir dist
          cp "build/Russian US Punctuation.bundle.zip" \
             "dist/Russian.US.Punctuation.bundle.zip"
          cp docs/preview.svg "dist/Russian.US.Punctuation.preview.svg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Russian – U.S. Punctuation ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*
